# Local docker-compose for the e2e test target.
#
# Spins up the 7 phase-1 services (gateway + 6 backends + battle) plus dependencies:
# Postgres, Pub/Sub emulator, Firestore emulator, Redis.
#
# All services are built from sibling repos checked out next to overload-party-e2e.
# Building Go services (account / card / shop / scenario / gateway) requires a single
# GitHub App installation token as a docker secret. matchmaking has no private
# cross-repo dependencies and battle resolves dependencies via Cloudsmith, so neither
# needs the token.
#
#   secrets/GO_MODULES_TOKEN  (overload-party-cross-repo-deps App の installation token)
#
# Token は Cross-Repo Deps App から都度生成する (1 時間 expire)。
# helper script で発行:
#   GITHUB_APP_ID=... GITHUB_APP_PRIVATE_KEY=path/to/key.pem \
#     ./docker/scripts/generate-go-modules-token.sh
#
#   pnpm compose:up
#
# Each service is published on the host port its *_SERVICE_URL points at, so tests can
# reach gateway and Pub/Sub-driven flows work without additional networking.

name: overload-party-e2e

x-go-build-secrets: &go-build-secrets
  - source: GO_MODULES_TOKEN

# ローカルスタックには鍵管理基盤が無いため、gateway が発行する内部認証 JWT (RS256) の
# 鍵対はこの compose 専用に生成したものを直接埋め込む。
x-internal-auth-public-key: &internal-auth-public-key |
  -----BEGIN PUBLIC KEY-----
  MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAuLZaind+mEMdRYBq7ivA
  Zo7nWFmIUYi3po4dGO6FKHo4o4ZDRBnqonBnSEeD0HOuq/95juP4D5VdrFcSjgBh
  D8vzul2Z8+m+caZlljKs7mrOhzHj69zm78HHzHghG+iml2az0SD5LUBdNwMpRzFj
  fxoY1Y32tCbfByhyQl2LbLHqIk8OfMCj4GlAu5e6Sfr4Dc5QOgsGd5mnGXBVCPYB
  1guv3a8Fpwn57YrwWJDkVh3fIO35Lpubt5plD+ymEQ2kSvej7I7zWWs9e96u1Ch3
  0Br61Jyp/TXNe473Xzkew7SkiiVviVz2hLJuszltyeSqYEEQ+Dilla27fz+rszbA
  twIDAQAB
  -----END PUBLIC KEY-----

secrets:
  GO_MODULES_TOKEN:
    file: ../secrets/GO_MODULES_TOKEN

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: account,card,shop,scenario,gateway
    volumes:
      - ./postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/00_init.sh:ro
      - ../../overload-party-account/db/schema.sql:/docker-entrypoint-initdb.d/01_account.sql:ro
      - ../../overload-party-card/db/schema.sql:/docker-entrypoint-initdb.d/02_card.sql:ro
      - ../../overload-party-shop/db/schema.sql:/docker-entrypoint-initdb.d/03_shop.sql:ro
      - ../../overload-party-scenario/db/schema.sql:/docker-entrypoint-initdb.d/04_scenario.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: >
      gcloud beta emulators pubsub start
      --project=overload-party-local
      --host-port=0.0.0.0:8085
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8085 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  firestore-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: >
      gcloud beta emulators firestore start
      --project=overload-party-local
      --host-port=0.0.0.0:8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  pubsub-init:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    depends_on:
      pubsub-emulator:
        condition: service_healthy
    environment:
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      PUBSUB_PROJECT_ID: overload-party-local
    volumes:
      - ./pubsub/init-topics.sh:/init-topics.sh:ro
    entrypoint: ["/bin/bash", "/init-topics.sh"]
    restart: "no"

  account:
    build:
      context: ../../overload-party-account
      secrets: *go-build-secrets
    depends_on:
      postgres:
        condition: service_healthy
      firestore-emulator:
        condition: service_healthy
      pubsub-init:
        condition: service_completed_successfully
    environment:
      PORT: "9005"
      LOG_MODE: local
      DATABASE_CONN: postgres://postgres:postgres@postgres:5432/account?sslmode=disable
      DATABASE_IAM_AUTH_ENABLED: "false"
      GOOGLE_CLOUD_PROJECT_ID: overload-party-local
      FIRESTORE_EMULATOR_HOST: firestore-emulator:8080
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      PUBSUB_PROJECT_ID: overload-party-local
      INTERNAL_AUTH_PUBLIC_KEY: *internal-auth-public-key
    ports:
      - "9005:9005"

  card:
    build:
      context: ../../overload-party-card
      secrets: *go-build-secrets
    depends_on:
      postgres:
        condition: service_healthy
      pubsub-init:
        condition: service_completed_successfully
    environment:
      ENV: local
      PORT: "9003"
      DATABASE_CONN: postgres://postgres:postgres@postgres:5432/card?sslmode=disable
      DATABASE_IAM_AUTH_ENABLED: "false"
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      PUBSUB_PROJECT_ID: overload-party-local
      ACCOUNT_SERVICE_URL: http://account:9005
      INTERNAL_AUTH_PUBLIC_KEY: *internal-auth-public-key
    ports:
      - "9003:9003"

  shop:
    build:
      context: ../../overload-party-shop
      secrets: *go-build-secrets
    depends_on:
      postgres:
        condition: service_healthy
      firestore-emulator:
        condition: service_healthy
      pubsub-init:
        condition: service_completed_successfully
    environment:
      ENV: local
      PORT: "9006"
      LOG_MODE: local
      DATABASE_CONN: postgres://postgres:postgres@postgres:5432/shop?sslmode=disable
      DATABASE_IAM_AUTH_ENABLED: "false"
      GOOGLE_CLOUD_PROJECT: overload-party-local
      FIRESTORE_EMULATOR_HOST: firestore-emulator:8080
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      PUBSUB_PROJECT_ID: overload-party-local
      CARD_PACK_PURCHASED_TOPIC: card-pack-purchased
      FACTION_ACQUIRED_TOPIC: faction-acquired
      PREMIUM_UPDATED_TOPIC: premium-updated
      # ローカルからは Apple / Google のレシート検証 API を叩けないため、検証を stub にする。
      IAP_VERIFIER: stub
      OUTBOX_POLL_INTERVAL: 1s
      OUTBOX_BATCH_SIZE: "100"
      OUTBOX_FAILURE_THRESHOLD: "5"
      OUTBOX_VISIBILITY_TIMEOUT: 30s
      INTERNAL_AUTH_PUBLIC_KEY: *internal-auth-public-key
    ports:
      - "9006:9006"

  scenario:
    build:
      context: ../../overload-party-scenario
      secrets: *go-build-secrets
    depends_on:
      postgres:
        condition: service_healthy
      firestore-emulator:
        condition: service_healthy
      pubsub-init:
        condition: service_completed_successfully
      account:
        condition: service_started
    environment:
      ENV: local
      PORT: "9007"
      DATABASE_CONN: postgres://postgres:postgres@postgres:5432/scenario?sslmode=disable
      DATABASE_IAM_AUTH_ENABLED: "false"
      GOOGLE_CLOUD_PROJECT_ID: overload-party-local
      FIRESTORE_EMULATOR_HOST: firestore-emulator:8080
      FIRESTORE_PROJECT_ID: overload-party-local
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      PUBSUB_PROJECT_ID: overload-party-local
      # ローカルスタックは Cloud Storage に到達できないため、スクリプトの読み出し元を
      # コンテナのファイルシステムに向ける。
      STORY_BUCKET: local:/app/scripts
      ONBOARDING_NAME_SET_TOPIC: onboarding-name-set
      ONBOARDING_FACTION_SET_TOPIC: onboarding-faction-set
      PLAYER_ONBOARDED_TOPIC: player-onboarded
      ACCOUNT_BASE_URL: http://account:9005
      OUTBOX_POLL_INTERVAL: 1s
      OUTBOX_BATCH_SIZE: "100"
      OUTBOX_FAILURE_THRESHOLD: "5"
      OUTBOX_VISIBILITY_TIMEOUT: 30s
      INTERNAL_AUTH_PUBLIC_KEY: *internal-auth-public-key
    ports:
      - "9007:9007"

  matchmaking:
    build:
      context: ../../overload-party-matchmaking
    depends_on:
      redis:
        condition: service_healthy
      pubsub-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: local
      PORT: "9004"
      UPSTASH_REDIS_URL: redis://redis:6379
      GOOGLE_CLOUD_PROJECT_ID: overload-party-local
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      PUBSUB_PROJECT_ID: overload-party-local
      MATCH_MADE_TOPIC: matchmaking-events
      MATCHMAKING_CIRCUIT_THRESHOLD: "5"
      MATCHMAKING_CIRCUIT_COOLDOWN_SEC: "30"
      MATCHMAKING_DRAIN_TIMEOUT_SEC: "10"
      INTERNAL_AUTH_PUBLIC_KEY: *internal-auth-public-key
    ports:
      - "9004:9004"

  battle:
    build:
      context: ../../overload-party-battle
    environment:
      ASPNETCORE_ENVIRONMENT: Local
      ASPNETCORE_URLS: http://+:9002
    ports:
      - "9002:9002"

  gateway:
    build:
      context: ../../overload-party-gateway
      secrets: *go-build-secrets
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pubsub-init:
        condition: service_completed_successfully
      firestore-emulator:
        condition: service_healthy
      account:
        condition: service_started
      card:
        condition: service_started
      shop:
        condition: service_started
      scenario:
        condition: service_started
      matchmaking:
        condition: service_started
      battle:
        condition: service_started
    # イメージ既定の cmd/main は Firebase ID トークン検証と Google 署名付き Pub/Sub push
    # 認証を要求し、このスタックが供給できない資格情報に依存するため、テストが使う
    # dev-token を受け付けるローカルモードのバイナリを起動する。
    entrypoint: ["/app/local"]
    environment:
      ENV: local
      PORT: "9001"
      DATABASE_CONN: postgres://postgres:postgres@postgres:5432/gateway?sslmode=disable
      DATABASE_IAM_AUTH_ENABLED: "false"
      ACCOUNT_SERVICE_URL: http://account:9005
      CARD_SERVICE_URL: http://card:9003
      MATCHMAKING_SERVICE_URL: http://matchmaking:9004
      SHOP_SERVICE_URL: http://shop:9006
      SCENARIO_SERVICE_URL: http://scenario:9007
      BATTLE_SERVER_URL: http://battle:9002
      # Phase 1 の e2e シナリオが /news と /support を通らないため、転送先の宛先だけ与えて
      # サービス自体はこのスタックに置かない。
      NEWS_SERVICE_URL: http://news:9008
      SUPPORT_SERVICE_URL: http://support:9009
      FIRESTORE_EMULATOR_HOST: firestore-emulator:8080
      FIRESTORE_PROJECT_ID: overload-party-local
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:9001
      UPSTASH_REDIS_URL: redis://redis:6379
      INTERNAL_AUTH_PRIVATE_KEY: |
