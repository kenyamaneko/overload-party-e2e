    ports:
      - "9001:9001"

  # gateway のイメージは distroless でシェルも HTTP クライアントも持たず、コンテナ内で
  # healthcheck を実行できないため、到達確認を別のコンテナから行う。
  gateway-ready:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    depends_on:
      gateway:
        condition: service_started
    # 一度終了するコンテナは `docker compose up --wait` を失敗させるため、常駐させて
    # 到達可否を healthcheck で表す。
    entrypoint: ["sleep", "infinity"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://gateway:9001/api/v1/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30

  # React client (Vite SPA)。UI E2E が実際の画面を操作できるよう `vite preview` で
  # 配信する。VITE_* はホスト側に公開された gateway を指してビルドする。SPA は
  # ホストのブラウザ上で動くため localhost:9001 は正しく解決される。ポート 5173 は
  # 上記 gateway の ALLOWED_ORIGINS と対応する。
  #
  # ビルド時に @kenyamaneko/* の認証が必要になった場合は、以下の build に
  #     secrets:
  #       - CLOUDSMITH_TOKEN
  # を追加し、トップレベルの `secrets:` ブロックにも CLOUDSMITH_TOKEN を
  # 宣言する (file: ../secrets/CLOUDSMITH_TOKEN)。
  client:
    build:
      context: ../../overload-party-client
      args:
        VITE_API_BASE_URL: http://localhost:9001
        VITE_WS_HOST: localhost:9001
        # client は vite preview (DEV=false) で動くため VITE_ASSET_BASE_URL が必須で、
        # 自己配信の空マニフェスト (public/manifest.json) を指せば解決する。
        VITE_ASSET_BASE_URL: http://localhost:5173
    depends_on:
      gateway-ready:
        condition: service_healthy
    ports:
      - "5173:5173"
