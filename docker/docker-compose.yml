# e2e テスト対象のローカル docker-compose。
#
# phase-1 の7サービス (gateway + backend 6つ + battle) と、その依存先
# (Postgres / Pub/Sub エミュレータ / Firestore エミュレータ / Redis) を起動する。
#
# 各サービスは overload-party-e2e と同じ階層に checkout された兄弟リポジトリから
# ビルドする。Go サービス (account / card / shop / scenario / gateway / matchmaking)
# のビルドには GitHub App の installation token を docker secret として1つ渡す
# 必要がある。battle は依存解決を Cloudsmith 経由で行うため、この secret は不要。
#
#   secrets/GO_MODULES_TOKEN  (overload-party-cross-repo-deps App の installation token)
#
# Token は Cross-Repo Deps App から都度生成する (1時間で失効)。
# helper script で発行:
#   GITHUB_APP_ID=... GITHUB_APP_PRIVATE_KEY=path/to/key.pem \
#     ./docker/scripts/generate-go-modules-token.sh
#
#   pnpm compose:up
#
# 各サービスはそれぞれの *_SERVICE_URL が指すホストポートで公開されるため、
# テストは追加のネットワーク設定無しで gateway や Pub/Sub 駆動のフローに到達できる。

name: overload-party-e2e

x-go-build-secrets: &go-build-secrets
  - source: GO_MODULES_TOKEN

# ローカルスタックには鍵管理基盤が無いため、gateway が発行する内部認証 JWT (RS256) の
# 鍵対はこの compose 専用に生成したものを直接埋め込む。
x-internal-auth-public-key: &internal-auth-public-key |
  -----BEGIN PUBLIC KEY-----
  MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAtonwE0LCBQAsbZk6fcso
  ZOW3i3CohQfVQy3yn7gQV/Pv5roZWT2Ao45zhRqwZ8tv+mmZ8PbxU4NNQ9u2Orvq
  /njIX/CdILUfYcGFg3eiQeuA/f8dqB1uE+OtbvZBZit4uBHwJl+47oVO7Ow7w4F1
  GNoJuVnOB8ilY8rzB+HDgSJZgwycllxYoXl8pIACsbwqxPYY4YFnUf9lI1baAxao
  Rf4daUKB8oe7ym2MwRtobvPZoB0lBeO/igeW4uqcdv5gDbF6OwTkiOdWBosl1HDA
  0TK9+HtuniNd3M9kKyIWslxvpinn79eMAQfcnI9S1zuhh1vRuhMQ/u8WdAvM54AN
  AQIDAQAB
  -----END PUBLIC KEY-----

secrets:
  GO_MODULES_TOKEN:
    file: ../secrets/GO_MODULES_TOKEN

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # 本番は各サービスのスキーマを1つのデータベースへ集約する (ops db-migrate が
      # スキーマの union を適用する) ため、サービス間でデータベースを共有しスキーマを
      # 跨いだ読み取りが成立する (例: scenario が account.players/player_factions を読む)。
      # 各サービスは接続ごとの search_path (下記 DATABASE_CONN 参照) で自スキーマに
      # 絞り込む。ここでも同じ単一データベース構成を再現する。
      POSTGRES_DB: overload_party
    volumes:
      # 各スキーマ (CREATE SCHEMA <svc> とそのテーブル群) と投入用シードは、この単一
      # データベースに対してファイル名順で適用される。全スキーマ作成 → card のシード
      # (product_id の FK 制約があるため products を initiatives より先に) → shop の
      # products の順。card は起動時にカード/プロダクト/施策キャッシュを即座に読み込み、
      # いずれかが空なら終了する。
      - ../../overload-party-account/db/schema.sql:/docker-entrypoint-initdb.d/01_account_schema.sql:ro
      - ../../overload-party-card/db/schema.sql:/docker-entrypoint-initdb.d/02_card_schema.sql:ro
      - ../../overload-party-shop/db/schema.sql:/docker-entrypoint-initdb.d/03_shop_schema.sql:ro
      - ../../overload-party-scenario/db/schema.sql:/docker-entrypoint-initdb.d/04_scenario_schema.sql:ro
      - ../../overload-party-gateway/db/schema.sql:/docker-entrypoint-initdb.d/05_gateway_schema.sql:ro
      - ../../overload-party-battle/db/schema.sql:/docker-entrypoint-initdb.d/06_battle_schema.sql:ro
      - ../../overload-party-card/db/seed/products_seed.sql:/docker-entrypoint-initdb.d/07_card_products_seed.sql:ro
      - ../../overload-party-card/db/seed/initiatives_seed.sql:/docker-entrypoint-initdb.d/08_card_initiatives_seed.sql:ro
      - ../../overload-party-card/db/seed/cards_seed.sql:/docker-entrypoint-initdb.d/09_card_cards_seed.sql:ro
      - ../../overload-party-card/db/seed/card_packs_seed.sql:/docker-entrypoint-initdb.d/10_card_packs_seed.sql:ro
      - ../../overload-party-shop/db/seed/products_seed.sql:/docker-entrypoint-initdb.d/11_shop_products_seed.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: >
      gcloud beta emulators pubsub start
      --project=overload-party-local
      --host-port=0.0.0.0:8085
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8085 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  firestore-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: >
      gcloud beta emulators firestore start
      --project=overload-party-local
      --host-port=0.0.0.0:8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  pubsub-init:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    depends_on:
      pubsub-emulator:
        condition: service_healthy
    environment:
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      PUBSUB_PROJECT_ID: overload-party-local
    volumes:
      - ./pubsub/init-topics.sh:/init-topics.sh:ro
    entrypoint: ["/bin/bash", "/init-topics.sh"]
    restart: "no"

  # ops のシードツールを使い、common の SSoT yaml から Firestore エミュレータの
  # game_config コレクションを投入する。account は起動時に必須の game_config キーを
  # 検証するため、この完了を待つ。実環境では同じツールを実際の Cloud Firestore に対して実行する。
  firestore-init:
    image: python:3.12-slim
    depends_on:
      firestore-emulator:
        condition: service_healthy
    environment:
      FIRESTORE_EMULATOR_HOST: firestore-emulator:8080
    volumes:
      - ../../overload-party-ops/firestore-seed/seed_game_config.py:/seed/seed_game_config.py:ro
      - ../../overload-party-common/data/game_config_defaults.yaml:/seed/game_config_defaults.yaml:ro
    entrypoint:
      - /bin/sh
      - -c
      - pip install --quiet google-cloud-firestore pyyaml && python3 /seed/seed_game_config.py --project overload-party-local --source /seed/game_config_defaults.yaml
    restart: "no"

  account:
    build:
      context: ../../overload-party-account
      secrets: *go-build-secrets
    depends_on:
      postgres:
        condition: service_healthy
      firestore-emulator:
        condition: service_healthy
      firestore-init:
        condition: service_completed_successfully
      pubsub-init:
        condition: service_completed_successfully
    environment:
      PORT: "9005"
      LOG_MODE: local
      DATABASE_CONN: host=postgres port=5432 user=postgres password=postgres dbname=overload_party sslmode=disable search_path=account,public
      DATABASE_IAM_AUTH_ENABLED: "false"
      GOOGLE_CLOUD_PROJECT_ID: overload-party-local
      FIRESTORE_EMULATOR_HOST: firestore-emulator:8080
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      PUBSUB_PROJECT_ID: overload-party-local
      INTERNAL_AUTH_PUBLIC_KEY: *internal-auth-public-key
    ports:
      - "9005:9005"

  card:
    build:
      context: ../../overload-party-card
      secrets: *go-build-secrets
    depends_on:
      postgres:
        condition: service_healthy
      pubsub-init:
        condition: service_completed_successfully
    environment:
      ENV: dev
      PORT: "9003"
      DATABASE_CONN: host=postgres port=5432 user=postgres password=postgres dbname=overload_party sslmode=disable search_path=card,public
      DATABASE_IAM_AUTH_ENABLED: "false"
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      PUBSUB_PROJECT_ID: overload-party-local
      ACCOUNT_SERVICE_URL: http://account:9005
      INTERNAL_AUTH_PUBLIC_KEY: *internal-auth-public-key
    ports:
      - "9003:9003"

  shop:
    build:
      context: ../../overload-party-shop
      secrets: *go-build-secrets
    depends_on:
      postgres:
        condition: service_healthy
      firestore-emulator:
        condition: service_healthy
      pubsub-init:
        condition: service_completed_successfully
    environment:
      IAP_MODE: local
      PORT: "9006"
      LOG_MODE: local
      DATABASE_CONN: host=postgres port=5432 user=postgres password=postgres dbname=overload_party sslmode=disable search_path=shop,public
      DATABASE_IAM_AUTH_ENABLED: "false"
      GOOGLE_CLOUD_PROJECT: overload-party-local
      FIRESTORE_EMULATOR_HOST: firestore-emulator:8080
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      PUBSUB_PROJECT_ID: overload-party-local
      CARD_PACK_PURCHASED_TOPIC: card-pack-purchased
      FACTION_ACQUIRED_TOPIC: faction-acquired
      PREMIUM_UPDATED_TOPIC: premium-updated
      # ローカルからは Apple / Google のレシート検証 API を叩けないため、検証を stub にする。
      IAP_VERIFIER: stub
      OUTBOX_POLL_INTERVAL: 1s
      OUTBOX_BATCH_SIZE: "100"
      OUTBOX_FAILURE_THRESHOLD: "5"
      OUTBOX_VISIBILITY_TIMEOUT: 30s
      INTERNAL_AUTH_PUBLIC_KEY: *internal-auth-public-key
    ports:
      - "9006:9006"

  scenario:
    build:
      context: ../../overload-party-scenario
      secrets: *go-build-secrets
    depends_on:
      postgres:
        condition: service_healthy
      firestore-emulator:
        condition: service_healthy
      pubsub-init:
        condition: service_completed_successfully
      account:
        condition: service_started
    environment:
      ENV: local
      PORT: "9007"
      # scenario はエピソード解放判定のため account.players / account.player_factions
      # を読むので、共有データベース内で search_path に account スキーマも含める。
      DATABASE_CONN: host=postgres port=5432 user=postgres password=postgres dbname=overload_party sslmode=disable search_path=scenario,account,public
      DATABASE_IAM_AUTH_ENABLED: "false"
      GOOGLE_CLOUD_PROJECT_ID: overload-party-local
      FIRESTORE_EMULATOR_HOST: firestore-emulator:8080
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      PUBSUB_PROJECT_ID: overload-party-local
      # ローカルスタックは Cloud Storage に到達できないため、スクリプトの読み出し元を
      # コンテナのファイルシステムに向ける。
      STORY_BUCKET: local:/app/scripts
      ONBOARDING_NAME_SET_TOPIC: onboarding-name-set
      ONBOARDING_FACTION_SET_TOPIC: onboarding-faction-set
      PLAYER_ONBOARDED_TOPIC: player-onboarded
      ACCOUNT_BASE_URL: http://account:9005
      OUTBOX_POLL_INTERVAL: 1s
      OUTBOX_BATCH_SIZE: "100"
      OUTBOX_FAILURE_THRESHOLD: "5"
      OUTBOX_VISIBILITY_TIMEOUT: 30s
      INTERNAL_AUTH_PUBLIC_KEY: *internal-auth-public-key
    ports:
      - "9007:9007"

  matchmaking:
    build:
      context: ../../overload-party-matchmaking
      secrets: *go-build-secrets
    depends_on:
      redis:
        condition: service_healthy
      pubsub-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: local
      PORT: "9004"
      UPSTASH_REDIS_URL: redis://redis:6379
      GOOGLE_CLOUD_PROJECT_ID: overload-party-local
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      PUBSUB_PROJECT_ID: overload-party-local
      MATCH_MADE_TOPIC: matchmaking-events
      MATCHMAKING_CIRCUIT_THRESHOLD: "5"
      MATCHMAKING_CIRCUIT_COOLDOWN_SEC: "30"
      MATCHMAKING_DRAIN_TIMEOUT_SEC: "10"
      INTERNAL_AUTH_PUBLIC_KEY: *internal-auth-public-key
    ports:
      - "9004:9004"

  battle:
    build:
      context: ../../overload-party-battle
    depends_on:
      postgres:
        condition: service_healthy
      card:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Local
      ASPNETCORE_URLS: http://+:9002
      # battle は Npgsql を使う (.NET の接続文字列形式であり libpq ではない) ため、
      # 共有データベース内の battle スキーマを所有し、無修飾のクエリは
      # Search Path=battle で解決される。
      DATABASE_CONN: Host=postgres;Port=5432;Database=overload_party;Username=postgres;Password=postgres;Search Path=battle
    ports:
      - "9002:9002"

  gateway:
    build:
      context: ../../overload-party-gateway
      secrets: *go-build-secrets
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pubsub-init:
        condition: service_completed_successfully
      firestore-emulator:
        condition: service_healthy
      account:
        condition: service_started
      card:
        condition: service_started
      shop:
        condition: service_started
      scenario:
        condition: service_started
      matchmaking:
        condition: service_started
      battle:
        condition: service_started
    # イメージ既定の cmd/main は Firebase ID トークン検証と Google 署名付き Pub/Sub push
    # 認証を要求し、このスタックが供給できない資格情報に依存するため、テストが使う
    # dev-token を受け付けるローカルモードのバイナリを起動する。
    entrypoint: ["/app/local"]
    environment:
      ENV: local
      PORT: "9001"
      DATABASE_CONN: host=postgres port=5432 user=postgres password=postgres dbname=overload_party sslmode=disable search_path=gateway,public
      DATABASE_IAM_AUTH_ENABLED: "false"
      GOOGLE_CLOUD_PROJECT_ID: overload-party-local
      ACCOUNT_SERVICE_URL: http://account:9005
      CARD_SERVICE_URL: http://card:9003
      MATCHMAKING_SERVICE_URL: http://matchmaking:9004
      SHOP_SERVICE_URL: http://shop:9006
      SCENARIO_SERVICE_URL: http://scenario:9007
      BATTLE_SERVER_URL: http://battle:9002
      # Phase 1 の e2e シナリオが /news と /support を通らないため、転送先の宛先だけ与えて
      # サービス自体はこのスタックに置かない。
      NEWS_SERVICE_URL: http://news:9008
      SUPPORT_SERVICE_URL: http://support:9009
      FIRESTORE_EMULATOR_HOST: firestore-emulator:8080
      FIRESTORE_PROJECT_ID: overload-party-local
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:9001
      UPSTASH_REDIS_URL: redis://redis:6379
      INTERNAL_AUTH_PRIVATE_KEY: |
        -----BEGIN PRIVATE KEY-----
        MIIEvgIBADANBgkqhkiG9w0BAQEFAASCBKgwggSkAgEAAoIBAQC2ifATQsIFACxt
