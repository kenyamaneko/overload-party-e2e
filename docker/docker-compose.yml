# Local docker-compose for the e2e test target.
#
# Spins up the 7 phase-1 services (gateway + 6 backends + battle) plus dependencies:
# Postgres, Pub/Sub emulator, Firestore emulator, Redis.
#
# All services are built from sibling repos checked out next to overload-party-e2e.
# Building Go services (account / card / shop / scenario / gateway) requires a single
# GitHub App installation token as a docker secret. matchmaking has no private
# cross-repo dependencies and battle resolves dependencies via Cloudsmith, so neither
# needs the token.
#
#   secrets/GO_MODULES_TOKEN  (overload-party-cross-repo-deps App の installation token)
#
# Token は Cross-Repo Deps App から都度生成する (1 時間 expire)。
# helper script で発行:
#   GITHUB_APP_ID=... GITHUB_APP_PRIVATE_KEY=path/to/key.pem \
#     ./docker/scripts/generate-go-modules-token.sh
#
#   pnpm compose:up
#
# Services bind to host ports matching gateway's defaults (BATTLE_SERVER_URL=...:9002 etc.)
# so tests against local Pub/Sub-driven flows work without additional networking.

name: overload-party-e2e

x-go-build-secrets: &go-build-secrets
  - source: GO_MODULES_TOKEN

secrets:
  GO_MODULES_TOKEN:
    file: ../secrets/GO_MODULES_TOKEN

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: account,card,shop,scenario,gateway
    volumes:
      - ./postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/00_init.sh:ro
      - ../../overload-party-account/db/schema.sql:/docker-entrypoint-initdb.d/01_account.sql:ro
      - ../../overload-party-card/db/schema.sql:/docker-entrypoint-initdb.d/02_card.sql:ro
      - ../../overload-party-shop/db/schema.sql:/docker-entrypoint-initdb.d/03_shop.sql:ro
      - ../../overload-party-scenario/db/schema.sql:/docker-entrypoint-initdb.d/04_scenario.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: >
      gcloud beta emulators pubsub start
      --project=overload-party-local
      --host-port=0.0.0.0:8085
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8085 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  firestore-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: >
      gcloud beta emulators firestore start
      --project=overload-party-local
      --host-port=0.0.0.0:8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  pubsub-init:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    depends_on:
      pubsub-emulator:
        condition: service_healthy
    environment:
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      PUBSUB_PROJECT_ID: overload-party-local
    volumes:
      - ./pubsub/init-topics.sh:/init-topics.sh:ro
    entrypoint: ["/bin/bash", "/init-topics.sh"]
    restart: "no"

  account:
    build:
      context: ../../overload-party-account
      secrets: *go-build-secrets
    depends_on:
      postgres:
        condition: service_healthy
      pubsub-init:
        condition: service_completed_successfully
    environment:
      ENV: local
      PORT: "9005"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/account?sslmode=disable
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      PUBSUB_PROJECT_ID: overload-party-local
    ports:
      - "9005:9005"

  card:
    build:
      context: ../../overload-party-card
      secrets: *go-build-secrets
    depends_on:
      postgres:
        condition: service_healthy
      pubsub-init:
        condition: service_completed_successfully
    environment:
      ENV: local
      PORT: "9003"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/card?sslmode=disable
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      PUBSUB_PROJECT_ID: overload-party-local
      ACCOUNT_SERVICE_URL: http://account:9005
    ports:
      - "9003:9003"

  shop:
    build:
      context: ../../overload-party-shop
      secrets: *go-build-secrets
    depends_on:
      postgres:
        condition: service_healthy
      pubsub-init:
        condition: service_completed_successfully
    environment:
      ENV: local
      PORT: "9006"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/shop?sslmode=disable
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      PUBSUB_PROJECT_ID: overload-party-local
    ports:
      - "9006:9006"

  scenario:
    build:
      context: ../../overload-party-scenario
      secrets: *go-build-secrets
    depends_on:
      postgres:
        condition: service_healthy
      firestore-emulator:
        condition: service_healthy
      pubsub-init:
        condition: service_completed_successfully
      account:
        condition: service_started
    environment:
      ENV: local
      PORT: "9007"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/scenario?sslmode=disable
      FIRESTORE_EMULATOR_HOST: firestore-emulator:8080
      FIRESTORE_PROJECT_ID: overload-party-local
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      PUBSUB_PROJECT_ID: overload-party-local
      ACCOUNT_SERVICE_URL: http://account:9005
    ports:
      - "9007:9007"

  matchmaking:
    build:
      context: ../../overload-party-matchmaking
    depends_on:
      redis:
        condition: service_healthy
      pubsub-init:
        condition: service_completed_successfully
    environment:
      ENV: local
      PORT: "9004"
      REDIS_URL: redis://redis:6379
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      PUBSUB_PROJECT_ID: overload-party-local
    ports:
      - "9004:9004"

  battle:
    build:
      context: ../../overload-party-battle
    environment:
      ASPNETCORE_ENVIRONMENT: Local
      ASPNETCORE_URLS: http://+:9002
    ports:
      - "9002:9002"

  gateway:
    build:
      context: ../../overload-party-gateway
      secrets: *go-build-secrets
    depends_on:
      postgres:
        condition: service_healthy
      pubsub-init:
        condition: service_completed_successfully
      firestore-emulator:
        condition: service_healthy
      account:
        condition: service_started
      card:
        condition: service_started
      shop:
        condition: service_started
      scenario:
        condition: service_started
      matchmaking:
        condition: service_started
      battle:
        condition: service_started
    environment:
      ENV: local
      PORT: "9001"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/gateway?sslmode=disable
      ACCOUNT_SERVICE_URL: http://account:9005
      CARD_SERVICE_URL: http://card:9003
      MATCHMAKING_SERVICE_URL: http://matchmaking:9004
      SHOP_SERVICE_URL: http://shop:9006
      SCENARIO_SERVICE_URL: http://scenario:9007
      BATTLE_SERVER_URL: http://battle:9002
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      PUBSUB_PROJECT_ID: overload-party-local
      MATCHMAKING_SUBSCRIPTION: matchmaking-events-gateway
      FIRESTORE_EMULATOR_HOST: firestore-emulator:8080
      FIRESTORE_PROJECT_ID: overload-party-local
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:9001
    ports:
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9001/api/v1/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30

  # React client (Vite SPA) served via `vite preview` so UI E2E can drive the real
  # screens. Built with VITE_* pointing at the host-published gateway; the SPA runs in
  # the host browser, so localhost:9001 resolves correctly. Port 5173 matches
  # gateway's ALLOWED_ORIGINS above.
  #
  # If @kenyamaneko/* needs auth at build time, add to build below:
  #     secrets:
  #       - CLOUDSMITH_TOKEN
  # and declare CLOUDSMITH_TOKEN in the top-level `secrets:` block
  # (file: ../secrets/CLOUDSMITH_TOKEN).
  client:
    build:
      context: ../../overload-party-client
      args:
        VITE_API_BASE_URL: http://localhost:9001
        VITE_WS_HOST: localhost:9001
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "5173:5173"
